# Build frontend on every push to main, deploy to cPanel via FTP (no SSH needed).
# SSH deploy is kept as fallback once DomainAdda enables shell access.
#
# REQUIRED GitHub Secrets:
#   VITE_API_URL  e.g. https://reddevils.co.in (bare origin, no /api suffix, no trailing /)
#   FTP_SERVER    e.g. kaveri.domainadda.com (from cPanel FTP Accounts -> Configure)
#   FTP_USERNAME  e.g. github@reddevils.co.in (must point to /public_html/spdelivery)
#   FTP_PASSWORD  password for that FTP account
#
# OPTIONAL (SSH, only works after DomainAdda enables jailed shell):
#   CPANEL_HOST, CPANEL_USER, CPANEL_SSH_KEY, CPANEL_PORT, FRONTEND_PATH, BACKEND_PATH
#
# BACKEND (no SSH? use this, no secrets needed):
#   cPanel -> Git Version Control -> Clone https://github.com/souravbrock/shapoorji-delivery
#   to ~/shapoorji-delivery -> on each deploy click Pull, copy server/* to
#   /home/reddevil/shapoorji-api -> Setup Node.js App -> Run NPM Install -> Restart.

name: Build and Deploy to cPanel

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  deploy-frontend-ftp:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Check FTP secrets configured
        id: gate
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "FTP secrets not configured, skipping frontend FTP deploy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

      - name: Deploy dist/ to cPanel via FTP
        if: steps.gate.outputs.skip != 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/
          # IMPORTANT: this FTP account's home directory must BE
          # /home/reddevil/public_html/spdelivery (set in cPanel -> FTP Accounts).
          # Then server-dir stays ./ . Do NOT set it to the full filesystem path.
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.DS_Store

  deploy-frontend-ssh:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # NOTE: secrets cannot be used in jobs.<id>.if, so we gate on a step instead.
      - name: Check SSH secrets configured
        id: gate
        run: |
          if [ -z "$CPANEL_HOST" ] || [ -z "$CPANEL_SSH_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "SSH secrets not configured, skipping frontend SSH deploy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}

      - name: Copy dist/ to cPanel via SCP
        if: steps.gate.outputs.skip != 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_PORT || 22 }}
          source: dist/*
          # Strip the leading dist/ so index.html lands at the docroot, not FRONTEND_PATH/dist/
          strip_components: 1
          target: ${{ secrets.FRONTEND_PATH }}

  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check SSH secrets configured
        id: gate
        run: |
          if [ -z "$CPANEL_HOST" ] || [ -z "$CPANEL_SSH_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "SSH secrets not configured, skipping backend deploy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}

      - name: Pull + install + restart Node app on cPanel
        if: steps.gate.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_PORT || 22 }}
          script: |
            set -e
            echo "=== backend deploy ==="
            cd "${{ secrets.BACKEND_PATH }}"
            # Sync code: prefer existing git checkout, else clone is a one-time manual step
            if [ -d .git ]; then
              git fetch origin main
              git reset --hard origin/main
            else
              echo "WARN: BACKEND_PATH is not a git checkout. Clone the repo here first."
              echo "Falling back to Git Version Control path ~/shapoorji-delivery if present."
              if [ -d ~/shapoorji-delivery/.git ]; then
                cd ~/shapoorji-delivery
                git pull origin main
                cp -r server/. "${{ secrets.BACKEND_PATH }}/"
                cd "${{ secrets.BACKEND_PATH }}"
              else
                exit 1
              fi
            fi
            # Install prod deps (cPanel Node selector uses this dir)
            if command -v npm >/dev/null 2>&1; then
              npm install --omit=dev
            fi
            # Trigger Passenger / Node app restart (whichever exists; ignore failures)
            mkdir -p tmp
            touch tmp/restart.txt || true
            (cloudlinux-selector restart --json --interpreter nodejs --app-root "$PWD" || true)
            echo "=== backend deploy done ==="
