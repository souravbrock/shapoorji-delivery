# Build frontend on every push to main, deploy everything to cPanel via FTP.
# (SSH from GitHub runners is blocked by the host firewall — connection reset
# on port 22 — so all deploys use FTP. Restart is via Passenger's restart.txt.)
#
# REQUIRED GitHub Secrets:
#   VITE_API_URL   e.g. https://reddevils.co.in (bare origin, no /api suffix, no trailing /)
#
# FRONTEND (FTP account rooted at the site docroot):
#   FTP_SERVER     e.g. kaveri.domainadda.com
#   FTP_USERNAME   e.g. github@reddevils.co.in (home = /home/reddevil/public_html/spdelivery)
#   FTP_PASSWORD   password for that FTP account
#
# BACKEND (separate FTP account rooted at the Node app root):
#   FTP_API_USERNAME  e.g. github-api@reddevils.co.in (home = /home/reddevil/shapoorji-api)
#   FTP_API_PASSWORD  password for that FTP account
#   (FTP_SERVER is reused as the host.)
#   NOTE: if server/package.json gains new dependencies, click
#   "Run NPM Install" once in Setup Node.js App — FTP cannot run npm.
#
# BACKEND MANUAL FALLBACK (no secrets needed):
#   cPanel -> Git Version Control -> ~/shapoorji-delivery -> Pull,
#   copy server/* to /home/reddevil/shapoorji-api -> Restart.

name: Build and Deploy to cPanel

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  deploy-frontend-ftp:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Check FTP secrets configured
        id: gate
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "FTP secrets not configured, skipping frontend FTP deploy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

      - name: Deploy dist/ to cPanel via FTP
        if: steps.gate.outputs.skip != 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/
          # IMPORTANT: this FTP account's home directory must BE
          # /home/reddevil/public_html/spdelivery (set in cPanel -> FTP Accounts).
          # Then server-dir stays ./ . Do NOT set it to the full filesystem path.
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.DS_Store

  deploy-backend-ftp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check backend FTP secrets configured
        id: gate
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_API_USERNAME" ] || [ -z "$FTP_API_PASSWORD" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Backend FTP secrets not configured, skipping backend FTP deploy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_API_USERNAME: ${{ secrets.FTP_API_USERNAME }}
          FTP_API_PASSWORD: ${{ secrets.FTP_API_PASSWORD }}

      - name: Upload server/ to the Node app root via FTP
        if: steps.gate.outputs.skip != 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_API_USERNAME }}
          password: ${{ secrets.FTP_API_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./server/
          # IMPORTANT: this FTP account's home directory must BE
          # /home/reddevil/shapoorji-api (set in cPanel -> FTP Accounts).
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.DS_Store
            **/node_modules/**
            public/uploads/**
            .env

      - name: Trigger Passenger restart
        if: steps.gate.outputs.skip != 'true'
        run: |
          mkdir -p restart-tmp/tmp
          date -u > restart-tmp/tmp/restart.txt
          cat restart-tmp/tmp/restart.txt

      - name: Upload restart trigger via FTP
        if: steps.gate.outputs.skip != 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_API_USERNAME }}
          password: ${{ secrets.FTP_API_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./restart-tmp/
          server-dir: ./
          dangerous-clean-slate: false
